<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Beautiful Bookmarks — Supabase</title>
  <meta name="description" content="Beautiful bookmark app with Supabase login and synced bookmarks across devices." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: rgba(255,255,255,.96);
      --muted: rgba(255,255,255,.68);
      --soft: rgba(255,255,255,.48);
      --line: rgba(255,255,255,.12);
      --line-strong: rgba(255,255,255,.18);
      --shadow: 0 30px 80px rgba(0,0,0,.38);
      --radius-xl: 28px;
      --blur: blur(20px);
      --maxw: 1320px;
      --ok: #dbe4ff;
      --err: #ffb4b4;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(125,149,255,.18), transparent 28%),
        radial-gradient(circle at 85% 12%, rgba(255,156,214,.12), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(69,178,255,.12), transparent 25%),
        linear-gradient(180deg, #111a31 0%, #0c1222 42%, #080d18 100%);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .hidden { display: none !important; }

    #bookmarkBody.collapsed {
      display: none;
    }

    .container {
      width: min(calc(100% - 28px), var(--maxw));
      margin: 0 auto;
      padding: 22px 0 52px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1.2fr minmax(260px, 420px);
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .25em;
      text-transform: uppercase;
      backdrop-filter: var(--blur);
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      margin: 14px 0 10px;
      font-weight: 700;
      line-height: 1.02;
      font-size: clamp(2.3rem, 5vw, 4.4rem);
      letter-spacing: -.03em;
    }

    .subtitle {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      font-size: clamp(.95rem, 1.4vw, 1.08rem);
      line-height: 1.75;
    }

    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      border: 1px solid var(--line);
      backdrop-filter: var(--blur);
      box-shadow: var(--shadow);
    }

    .panel {
      border-radius: var(--radius-xl);
      padding: 18px;
      margin-bottom: 18px;
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .panel-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .panel-note {
      margin: 4px 0 0;
      font-size: .82rem;
      color: var(--soft);
    }

    .status {
      margin-top: 10px;
      font-size: .78rem;
      display: none;
    }

    .status.show { display: block; }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 62px;
      padding: 0 16px;
      border-radius: 20px;
    }

    .search-wrap svg {
      width: 18px;
      height: 18px;
      color: var(--soft);
    }

    .search-wrap input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: .98rem;
    }

    .search-wrap input::placeholder {
      color: rgba(255,255,255,.42);
    }

    .bar-chip,
    .secondary-btn,
    .ghost-btn,
    .view-btn {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      min-height: 36px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: 160ms ease;
      white-space: nowrap;
    }

    .secondary-btn:hover,
    .ghost-btn:hover,
    .view-btn:hover {
      background: rgba(255,255,255,.10);
      border-color: var(--line-strong);
      color: var(--text);
      transform: translateY(-1px);
    }

    .secondary-btn:disabled,
    .ghost-btn:disabled,
    .view-btn:disabled,
    .primary-btn:disabled {
      cursor: default;
      opacity: .7;
      transform: none !important;
    }

    .view-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.06);
      backdrop-filter: var(--blur);
    }

    .view-btn.active {
      color: #0c1330;
      background: linear-gradient(180deg,#fff,#e8ebff);
      border-color: transparent;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(255,255,255,.10);
    }

    .primary-btn {
      border: none;
      border-radius: 16px;
      min-height: 48px;
      padding: 0 18px;
      background: linear-gradient(180deg,#fff,#e8ebff);
      color: #0c1330;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(255,255,255,.10);
      transition: 160ms ease;
    }

    .primary-btn:hover {
      transform: translateY(-1px) scale(1.01);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.7fr 1.5fr 1.7fr .8fr auto;
      gap: 12px;
    }

    .field { min-width: 0; }

    .field input {
      width: 100%;
      min-height: 48px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(4,7,16,.28);
      outline: none;
      color: var(--text);
      padding: 12px 14px;
      transition: 140ms ease;
    }

    .field input:focus {
      border-color: rgba(255,255,255,.22);
      box-shadow: 0 0 0 4px rgba(255,255,255,.05);
    }

    .field input::placeholder {
      color: rgba(255,255,255,.36);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0 16px;
      flex-wrap: wrap;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar-label {
      font-size: .88rem;
      font-weight: 700;
      color: rgba(255,255,255,.9);
    }

    .muted {
      color: var(--soft);
      font-size: .8rem;
    }

    .cards.gallery-view {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
    }

    .cards.list-view {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 22px 70px rgba(0,0,0,.32);
      transition: 200ms ease;
      min-width: 0;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,.18);
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.07));
    }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #141d33;
    }

    .thumb-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 260ms ease;
    }

    .card:hover .thumb-img {
      transform: scale(1.045);
    }

    .thumb-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.18), transparent 30%),
        linear-gradient(135deg, rgba(111,130,252,.9), rgba(137,90,255,.8) 38%, rgba(255,109,160,.75) 100%);
    }

    .thumb-pattern {
      position: absolute;
      inset: auto -15% -10% auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 62%);
      filter: blur(8px);
      opacity: .7;
    }

    .thumb-icon {
      width: 90px;
      height: 90px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.9rem;
      color: rgba(255,255,255,.96);
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.22);
    }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,10,20,.05) 0%, rgba(7,10,20,.10) 40%, rgba(4,5,10,.72) 100%);
      pointer-events: none;
    }
	.thumb-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      z-index: 2;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      max-width: 72%;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(7,11,22,.44);
      border: 1px solid rgba(255,255,255,.16);
      color: rgba(255,255,255,.92);
      font-size: .72rem;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(7,11,22,.36);
      color: rgba(255,255,255,.82);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      transition: 160ms ease;
      font-size: 11px;
      padding: 0;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.24);
      background: rgba(255,255,255,.10);
    }

    .card-body {
      padding: 14px 16px 16px;
      min-width: 0;
    }

    .card-title-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-title {
      margin: 0;
      flex: 1 1 auto;
      min-width: 0;
      font-size: 1.06rem;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -.015em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tiny-chip {
      flex: 0 0 auto;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      color: var(--soft);
      font-size: .5rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .card-desc {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 3.2em;
    }

    .card-footer {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .domain {
      font-size: .75rem;
      color: var(--soft);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .visit-pill {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.84);
      font-size: .78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .cards.list-view .list-item,
    .cards.list-view .list-title,
    .cards.list-view .list-domain,
    .cards.list-view .tiny-chip {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
    }

    .list-item {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto auto;
      gap: 6px;
      align-items: center;
      padding: 3px 6px;
      min-height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.05);
      background: rgba(255,255,255,.02);
      box-shadow: none;
    }

    .list-item:hover {
      border-color: rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
    }

    .list-main {
      min-width: 0;
      display: block;
      padding-right: 2px;
    }

    .list-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .list-title {
      font-size: .80rem;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.1;
    }

    .list-meta {
      min-width: 0;
      display: flex;
      justify-content: flex-end;
    }

    .list-domain {
      font-size: .66rem;
      color: var(--soft);
      white-space: nowrap;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-actions {
      display: flex;
      gap: 3px;
    }

    @media (max-width: 1100px) {
      .topbar { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .cards.gallery-view { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .list-item { grid-template-columns: minmax(0,1fr) auto; }
      .list-meta { display: none; }
    }

    @media (max-width: 720px) {
      .container {
        width: min(calc(100% - 18px), var(--maxw));
        padding-top: 14px;
      }

      .panel { padding: 14px; border-radius: 24px; }
      .form-grid { grid-template-columns: 1fr; }
      .cards.gallery-view { grid-template-columns: 1fr; }
      .list-item { grid-template-columns: 1fr auto; }
    }
  </style>
</head>
<body>
  <section id="authShell" class="auth-shell">
    <div class="auth-card glass">
      <div class="eyebrow">Bookmarks · Cloud Sync</div>
      <h1 class="auth-title">Sign in to your bookmark app</h1>

      <div class="auth-stack">
        <label class="field"><input id="authEmail" type="email" placeholder="Email address" /></label>
        <label class="field"><input id="authPassword" type="password" placeholder="Password" /></label>
      </div>

      <div class="auth-actions" style="margin-top:14px;">
        <button id="signInBtn" class="primary-btn" type="button">Sign in</button>
        <button id="signUpBtn" class="secondary-btn" type="button">Sign up</button>
        <button id="resetPwdBtn" class="ghost-btn" type="button">Reset password</button>
      </div>

      <div id="authStatus" class="status"></div>
    </div>
  </section>
<main id="appShell" class="container hidden">
    <section class="topbar">
      <div>
        <div class="eyebrow">Personal Space</div>
        <h1>My Beautiful Bookmarks</h1>
        <p class="subtitle">
          A compact, elegant bookmark wall — synced via Supabase.
        </p>
      </div>

      <label class="search-wrap glass">
        <input id="searchInput" type="search" placeholder="Search bookmarks..." />
      </label>
    </section>

    <section class="panel glass">
      <div class="panel-head">
        <div>
          <div id="bookmarkToggle" style="cursor:pointer;">
            <h2 class="panel-title">Add or edit bookmark</h2>
            <span id="toggleIcon">▸</span>
          </div>
          <p class="panel-note">
            Signed in as <span id="whoami"></span>
          </p>
        </div>

        <div style="display:flex;gap:10px;">
          <div class="bar-chip"><span id="bookmarkCount">0</span> saved</div>
          <button id="signOutBtn" class="ghost-btn">Sign out</button>
        </div>
      </div>

      <div id="bookmarkBody" class="collapsed">
        <form id="bookmarkForm" class="form-grid">
          <input type="hidden" id="editingId" />

          <input id="titleInput" placeholder="Title *" required />
          <input id="urlInput" placeholder="URL *" required />
          <input id="descInput" placeholder="Description" />

          <button class="primary-btn">Save bookmark</button>
        </form>
      </div>

      <div id="appStatus" class="status"></div>
    </section>

    <section id="cards" class="cards gallery-view"></section>

    <section id="emptyState" class="empty hidden">
      <p>No bookmarks yet</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://xqbxmjcgrvrxpdzndknv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_HpK9KL2G600M6tuCr8yX1w_2E_lkLAB';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let bookmarks = [];

    const els = {
      authShell: document.getElementById('authShell'),
      appShell: document.getElementById('appShell'),
      whoami: document.getElementById('whoami'),

      email: document.getElementById('authEmail'),
      password: document.getElementById('authPassword'),

      signInBtn: document.getElementById('signInBtn'),
      signUpBtn: document.getElementById('signUpBtn'),
      resetBtn: document.getElementById('resetPwdBtn'),

      status: document.getElementById('authStatus'),

      bookmarkBody: document.getElementById('bookmarkBody'),
      toggleIcon: document.getElementById('toggleIcon'),
      toggle: document.getElementById('bookmarkToggle'),

      form: document.getElementById('bookmarkForm'),
      title: document.getElementById('titleInput'),
      url: document.getElementById('urlInput'),
      desc: document.getElementById('descInput'),

      cards: document.getElementById('cards'),
      empty: document.getElementById('emptyState')
    };

    init();

    async function init() {
      bindEvents();

      const { data } = await sb.auth.getSession();
      currentUser = data?.session?.user || null;

      handleSession(currentUser);

      sb.auth.onAuthStateChange((event, session) => {
        currentUser = session?.user || null;
        handleSession(currentUser);
      });
    }

    function bindEvents() {
      els.signInBtn.onclick = signIn;
      els.signUpBtn.onclick = signUp;
      els.resetBtn.onclick = resetPassword;

      els.toggle.onclick = () => toggleForm();

      els.form.onsubmit = async (e) => {
        e.preventDefault();
        await saveBookmark();
      };
    }

    function toggleForm(force = null) {
      const open = force !== null
        ? force
        : els.bookmarkBody.classList.contains('collapsed');

      els.bookmarkBody.classList.toggle('collapsed', !open);
      els.toggleIcon.textContent = open ? '▾' : '▸';
    }

    function handleSession(user) {
      if (!user) {
        els.authShell.classList.remove('hidden');
        els.appShell.classList.add('hidden');
        return;
      }

      els.authShell.classList.add('hidden');
      els.appShell.classList.remove('hidden');

      if (els.whoami) els.whoami.textContent = user.email;

      loadBookmarks();
    }

    function showStatus(msg, isError=false) {
      els.status.textContent = msg;
      els.status.style.color = isError ? 'var(--err)' : 'var(--ok)';
      els.status.classList.add('show');
    }
	async function signOut() {
      const { error } = await sb.auth.signOut();

      if (error) {
        showStatus(error.message || 'Sign out failed', true);
        return;
      }

      showStatus('Signed out');
    }

    async function loadBookmarks() {
      if (!currentUser) return;

      const { data, error } = await sb
        .from('bookmarks')
        .select('id, user_id, title, url, description, created_at, updated_at')
        .eq('user_id', currentUser.id)
        .order('updated_at', { ascending: false })
        .order('created_at', { ascending: false });

      if (error) {
        showStatus(error.message || 'Could not load bookmarks', true);
        bookmarks = [];
        render();
        return;
      }

      bookmarks = Array.isArray(data) ? data : [];
      render();
    }

    async function saveBookmark() {
      if (!currentUser) {
        showStatus('You must be signed in', true);
        return;
      }

      const title = els.title.value.trim();
      const url = normalizeUrl(els.url.value.trim());
      const description = els.desc.value.trim();
      const editingId = els.editingId.value.trim();

      if (!title || !url) {
        showStatus('Please enter title and URL', true);
        return;
      }

      if (!isValidUrl(url)) {
        showStatus('Please enter a valid URL', true);
        return;
      }

      if (editingId) {
        const payload = {
          title,
          url,
          description: description || 'Quick access bookmark',
          updated_at: new Date().toISOString()
        };

        const { data, error } = await sb
          .from('bookmarks')
          .update(payload)
          .eq('id', editingId)
          .eq('user_id', currentUser.id)
          .select()
          .single();

        if (error) {
          showStatus(error.message || 'Update failed', true);
          return;
        }

        bookmarks = bookmarks.map((b) =>
          String(b.id) === String(editingId) ? data : b
        );

        resetForm();
        toggleForm(false);
        render();
        showAppStatus('Bookmark updated');
      } else {
        const payload = {
          user_id: currentUser.id,
          title,
          url,
          description: description || 'Quick access bookmark'
        };

        const { data, error } = await sb
          .from('bookmarks')
          .insert(payload)
          .select()
          .single();

        if (error) {
          showAppStatus(error.message || 'Save failed', true);
          return;
        }

        bookmarks.unshift(data);
        resetForm();
        toggleForm(false);
        render();
        showAppStatus('Bookmark saved');
      }
    }

    async function deleteBookmark(id) {
      if (!currentUser) return;

      const item = bookmarks.find((b) => String(b.id) === String(id));
      if (!item) return;

      if (!confirm(`Delete "${item.title}"?`)) return;

      const { error } = await sb
        .from('bookmarks')
        .delete()
        .eq('id', id)
        .eq('user_id', currentUser.id);

      if (error) {
        showAppStatus(error.message || 'Delete failed', true);
        return;
      }

      bookmarks = bookmarks.filter((b) => String(b.id) !== String(id));

      if (String(els.editingId.value) === String(id)) {
        resetForm();
      }

      render();
      showAppStatus('Bookmark deleted');
    }

    function editBookmark(id) {
      const item = bookmarks.find((b) => String(b.id) === String(id));
      if (!item) return;

      els.editingId.value = item.id;
      els.title.value = item.title || '';
      els.url.value = item.url || '';
      els.desc.value = item.description || '';

      toggleForm(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      els.title.focus();
    }

    function resetForm() {
      els.form.reset();
      els.editingId.value = '';
    }

    function showAppStatus(message, isError = false) {
      const el = document.getElementById('appStatus');
      if (!el) return;

      el.textContent = message;
      el.style.color = isError ? 'var(--err)' : 'var(--ok)';
      el.classList.add('show');

      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    function render() {
      const q = els.searchInput.value.trim().toLowerCase();

      const filtered = bookmarks.filter((b) => {
        const text = [
          b.title || '',
          b.url || '',
          b.description || ''
        ].join(' ').toLowerCase();

        return text.includes(q);
      });

      els.cards.innerHTML = '';

      const countEl = document.getElementById('bookmarkCount');
      if (countEl) countEl.textContent = String(bookmarks.length);

      if (!filtered.length) {
        els.empty.classList.remove('hidden');
        els.cards.classList.add('hidden');
        return;
      }

      els.empty.classList.add('hidden');
      els.cards.classList.remove('hidden');

      for (const item of filtered) {
        els.cards.appendChild(buildCard(item));
      }
    }

    function buildCard(item) {
      const tpl = document.getElementById('cardTemplate');
      const node = tpl.content.firstElementChild.cloneNode(true);

      const link = node.querySelector('.card-link');
      const title = node.querySelector('[data-title]');
      const desc = node.querySelector('[data-desc]');
      const tag = node.querySelector('[data-tag]');
      const domain = node.querySelector('[data-domain]');
      const initials = node.querySelector('[data-initials]');
      const editBtn = node.querySelector('[data-edit]');
      const deleteBtn = node.querySelector('[data-delete]');

      link.href = item.url;
      title.textContent = item.title || 'Untitled';
      desc.textContent = item.description || 'Quick access bookmark';
      tag.textContent = 'Saved';
      domain.textContent = getDomain(item.url);
      initials.textContent = getInitials(item.title, item.url);

      editBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        editBookmark(item.id);
      });

      deleteBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        deleteBookmark(item.id);
      });

      return node;
    }

    function normalizeUrl(value) {
      if (!value) return '';
      if (/^https?:\/\//i.test(value)) return value;
      return 'https://' + value;
    }

    function isValidUrl(value) {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol);
      } catch (_) {
        return false;
      }
    }

    function getDomain(url) {
      try {
        return new URL(normalizeUrl(url)).hostname.replace(/^www\./, '');
      } catch (_) {
        return url || '';
      }
    }

    function getInitials(title, url) {
      const source = String(title || getDomain(url) || 'BM').trim();
      const parts = source
        .replace(/https?:\/\//gi, '')
        .split(/[^A-Za-z0-9]+/)
        .filter(Boolean);

      const chars = (parts[0]?.[0] || '') + (parts[1]?.[0] || parts[0]?.[1] || '');
      return (chars.toUpperCase() || 'BM').slice(0, 2);
    }
  </script>
</body>
